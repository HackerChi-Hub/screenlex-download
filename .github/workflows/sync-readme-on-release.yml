name: 同步 GitHub README

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 指定 Release 标签；留空时使用最新正式版
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: screenlex-readme-sync
  cancel-in-progress: false

jobs:
  sync:
    name: 从 Release 生成公开主页
    runs-on: ubuntu-latest

    steps:
      - name: 检出公开下载库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 选择要同步的 Release
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${INPUT_TAG:-${EVENT_TAG:-}}"
          if [ -z "$tag" ]; then
            tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 读取 Release 资产与更新清单
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p .readme-sync
          gh release view "$TAG" --json tagName,body,assets,url > .readme-sync/release.json
          gh release download "$TAG" --pattern latest.json --dir .readme-sync

      - name: 生成 README
        run: |
          for language in zh-CN zh-TW en; do
            suffix=".$language"
            if [ "$language" = zh-CN ]; then suffix=""; fi
            node scripts/render-readme.mjs \
              --release-json .readme-sync/release.json \
              --latest-json .readme-sync/latest.json \
              --template "README${suffix}.template.md" \
              --output "README${suffix}.md" \
              --language "$language" \
              --repo "$GITHUB_REPOSITORY"
          done

      - name: 校验生成结果
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          test -s README.md
          grep -F "当前最新版：v${version}" README.md
          for file in README.md README.zh-TW.md README.en.md; do
            test -s "$file"
            grep -F "/releases/download/${TAG}/" "$file"
            if grep -Eq '\{\{[A-Z_]+\}\}' "$file"; then
              echo "$file 仍含未替换模板变量" >&2
              exit 1
            fi
          done
          node scripts/readme-contract.mjs
          git diff --check

      - name: 提交并推送 README
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git diff --quiet -- README.md README.zh-TW.md README.en.md; then
            echo "README 已与 ${TAG} 一致，无需提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-TW.md README.en.md
          git commit -m "docs: 同步 ${TAG} GitHub 主页"
          git push

      - name: 回读远端 README
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          for file in README.md README.zh-TW.md README.en.md; do
            gh api "repos/${GITHUB_REPOSITORY}/contents/${file}?ref=${GITHUB_REF_NAME}" \
              --jq .content | base64 --decode > ".readme-sync/remote-${file}"
            cmp "$file" ".readme-sync/remote-${file}"
          done
